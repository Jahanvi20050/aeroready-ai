# AeroReady AI Configuration File
dataset:
  subset: "FD003"
  data_dir: "data/raw"

preprocessing:
  rolling_window: 5
  window_length: 30
  variance_threshold: 1e-5
  regime_clusters:
    FD001: 1
    FD002: 6
    FD003: 1
    FD004: 6

model:
  type: "RandomForestRegressor"
  n_estimators: 100
  max_depth: 15
  min_samples_split: 5
  min_samples_leaf: 2
  random_state: 42
  n_jobs: -1

training:
  val_ratio: 0.2
  random_state: 42
  rul_cap: 125   # Piecewise RUL cap applied to training labels only
  seeds: [42, 123, 999]

uncertainty:
  calibration_fraction: 0.2
  split_seed: 2026
  cut_seed: 2027
  minimum_observed_cycles: 30
